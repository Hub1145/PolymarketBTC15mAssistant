<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket BTC 15m Assistant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8" x-data="assistantData()">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400" x-text="(data.trading_state?.symbol || 'BTC') + ' 15m Assistant'"></h1>
            <div class="flex space-x-4 items-center">
                <div class="flex items-center space-x-2 text-xs mr-4">
                    <div class="flex items-center">
                        <div :class="data.prices?.spot ? 'bg-green-500' : 'bg-red-500'" class="w-2 h-2 rounded-full mr-1"></div>
                        <span class="text-gray-400">Binance</span>
                    </div>
                    <div class="flex items-center">
                        <div :class="data.prices?.chainlink ? 'bg-green-500' : 'bg-red-500'" class="w-2 h-2 rounded-full mr-1"></div>
                        <span class="text-gray-400">Poly WS</span>
                    </div>
                </div>
                <a href="/settings" class="text-gray-400 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </a>
                <span :class="data.trading_state?.mode === 'paper' ? 'bg-yellow-600' : 'bg-red-600'"
                      class="px-4 py-1 rounded-full font-bold uppercase text-sm" x-text="data.trading_state?.mode"></span>
                <span class="bg-gray-800 px-4 py-1 rounded text-gray-400 text-sm" x-text="'Updated: ' + lastUpdate"></span>
            </div>
        </header>

        <!-- Market Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg border-l-4 border-blue-500">
                <p class="text-gray-400 text-sm uppercase">BTC Binance Spot</p>
                <h2 class="text-3xl font-mono" x-text="'$' + (data.prices?.spot?.toLocaleString() || '-')"></h2>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg border-l-4 border-green-500">
                <p class="text-gray-400 text-sm uppercase">Polymarket Chainlink</p>
                <h2 class="text-3xl font-mono" x-text="'$' + (data.prices?.chainlink?.toLocaleString() || '-')"></h2>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg border-l-4 border-purple-500">
                <p class="text-gray-400 text-sm uppercase" x-text="'Time Remaining (' + (data.analysis?.decision?.phase || '-') + ')'"></p>
                <h2 class="text-3xl font-mono" x-text="formatTime(data.timing?.remainingMinutes)"></h2>
            </div>
        </div>

        <!-- Prediction -->
        <div class="bg-gray-800 p-8 rounded-lg shadow-lg mb-8 text-center border-t-2 border-blue-600">
            <p class="text-gray-400 uppercase tracking-widest mb-4">Current Prediction</p>
            <div class="flex justify-center items-center space-x-12">
                <div class="text-center">
                    <p class="text-green-400 text-4xl font-bold" x-text="(data.analysis?.probability?.adjustedUp * 100).toFixed(1) + '%'"></p>
                    <p class="text-xs text-gray-500">PROB UP</p>
                </div>
                <div class="text-5xl font-black" :class="data.analysis?.decision?.action === 'ENTER' ? (data.analysis?.decision?.side === 'UP' ? 'text-green-500' : 'text-red-500') : 'text-gray-600'">
                    <span x-text="data.analysis?.decision?.action === 'ENTER' ? (data.analysis?.decision?.side === 'UP' ? 'BUY UP ↑' : 'BUY DOWN ↓') : 'NO TRADE'"></span>
                    <p class="text-xs uppercase mt-2 text-gray-400" x-text="data.analysis?.decision?.reason || ''"></p>
                </div>
                <div class="text-center">
                    <p class="text-red-400 text-4xl font-bold" x-text="(data.analysis?.probability?.adjustedDown * 100).toFixed(1) + '%'"></p>
                    <p class="text-xs text-gray-500">PROB DOWN</p>
                </div>
            </div>
        </div>

        <!-- Indicators -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h3 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Technical Indicators</h3>
                <div class="space-y-4">
                    <div class="flex justify-between">
                        <span class="text-gray-400">RSI (14)</span>
                        <span :class="data.indicators?.rsi > 70 ? 'text-red-400' : (data.indicators?.rsi < 30 ? 'text-green-400' : 'text-white')" x-text="data.indicators?.rsi?.toFixed(2) || '-'"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">VWAP</span>
                        <span x-text="'$' + (data.indicators?.vwap?.toFixed(0) || '-')"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">Heiken Ashi</span>
                        <span :class="data.indicators?.heiken?.color === 'green' ? 'text-green-400' : 'text-red-400'" x-text="(data.indicators?.heiken?.color || '-') + ' x' + (data.indicators?.heiken?.count || 0)"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">Market Regime</span>
                        <span class="font-bold text-blue-400" x-text="data.analysis?.regime?.regime || '-'"></span>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h3 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Polymarket Odds</h3>
                <div class="space-y-4">
                    <div class="flex justify-between">
                        <span class="text-green-400 font-bold uppercase">Up (YES)</span>
                        <span class="text-2xl font-mono text-green-400" x-text="data.prices?.poly_up ? (data.prices.poly_up * 100).toFixed(0) + '¢' : '-'"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-red-400 font-bold uppercase">Down (NO)</span>
                        <span class="text-2xl font-mono text-red-400" x-text="data.prices?.poly_down ? (data.prices.poly_down * 100).toFixed(0) + '¢' : '-'"></span>
                    </div>
                    <div class="flex justify-between border-t border-gray-700 pt-2">
                        <span class="text-gray-400">Model Edge (UP)</span>
                        <span :class="data.analysis?.edge?.edgeUp > 0 ? 'text-green-400' : 'text-red-400'" x-text="(data.analysis?.edge?.edgeUp * 100).toFixed(1) + '%'"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trading History & State -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h3 class="text-xl font-bold">Paper Trading Session</h3>
                <span class="text-2xl font-bold text-green-500" x-text="'$' + (data.trading_state?.balance?.toLocaleString() || '1,000')"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-500 text-sm">
                            <th class="pb-2">Market</th>
                            <th class="pb-2">Side</th>
                            <th class="pb-2">Entry</th>
                            <th class="pb-2">Shares</th>
                            <th class="pb-2 text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm">
                        <template x-for="trade in data.trading_state?.active_trades" :key="trade.market_id">
                            <tr class="border-t border-gray-700">
                                <td class="py-2 truncate max-w-[200px]" x-text="trade.market_slug"></td>
                                <td class="py-2" :class="trade.side === 'UP' ? 'text-green-400' : 'text-red-400'" x-text="trade.side"></td>
                                <td class="py-2" x-text="(trade.entry_price * 100).toFixed(0) + '¢'"></td>
                                <td class="py-2" x-text="trade.shares.toFixed(2)"></td>
                                <td class="py-2 text-right text-yellow-500 font-bold" x-text="trade.status"></td>
                            </tr>
                        </template>
                        <tr x-show="!data.trading_state?.active_trades?.length">
                            <td colspan="5" class="py-4 text-center text-gray-600">No active trades</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function assistantData() {
            return {
                data: {},
                lastUpdate: '-',
                init() {
                    this.refresh();
                    setInterval(() => this.refresh(), 1000);
                },
                async refresh() {
                    try {
                        const response = await fetch('/api/latest');
                        this.data = await response.json();
                        this.lastUpdate = new Date().toLocaleTimeString();
                    } catch (e) {
                        console.error("Refresh failed", e);
                    }
                },
                formatTime(mins) {
                    if (!mins && mins !== 0) return '--:--';
                    const totalSecs = Math.max(0, Math.floor(mins * 60));
                    const m = Math.floor(totalSecs / 60);
                    const s = totalSecs % 60;
                    return m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
                }
            }
        }
    </script>
</body>
</html>
