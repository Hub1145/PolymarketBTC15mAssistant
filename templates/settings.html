<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings - Polymarket Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 sm:p-8" x-data="settingsPage()" x-cloak>
    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 text-center sm:text-left">
            <h1 class="text-2xl sm:text-3xl font-bold text-blue-400">Application Settings</h1>
            <a href="/" class="w-full sm:w-auto bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded font-bold transition text-center">Back to Dashboard</a>
        </header>

        <form @submit.prevent="saveSettings" class="space-y-6 sm:space-y-8">
            <!-- Mode & Balance -->
            <div class="bg-gray-800 p-5 sm:p-6 rounded-lg shadow-lg">
                <h2 class="text-lg sm:text-xl font-bold mb-4 border-b border-gray-700 pb-2">Trading Mode</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Mode</label>
                        <select x-model="form.mode" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition">
                            <option value="paper">Paper Trading</option>
                            <option value="live">Live Trading</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Initial Balance (USD)</label>
                        <input type="number" x-model.number="form.paper_balance_usd" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>
            </div>

            <!-- Risk Management -->
            <div class="bg-gray-800 p-5 sm:p-6 rounded-lg shadow-lg">
                <h2 class="text-lg sm:text-xl font-bold mb-4 border-b border-gray-700 pb-2">Risk Management</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Risk Type</label>
                        <select x-model="form.trading.risk_type" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition">
                            <option value="fixed">Fixed Amount ($)</option>
                            <option value="percent">Percentage of Balance (%)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Risk Value</label>
                        <input type="number" step="0.01" x-model.number="form.trading.risk_value" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>
            </div>

            <!-- Markets -->
            <div class="bg-gray-800 p-5 sm:p-6 rounded-lg shadow-lg">
                <h2 class="text-lg sm:text-xl font-bold mb-4 border-b border-gray-700 pb-2">Market Configuration</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Binance Symbol</label>
                        <input type="text" x-model="form.trading.symbol" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition" placeholder="BTCUSDT">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Polymarket Series</label>
                        <select x-model="form.polymarket.series_id" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition">
                            <template x-for="s in availableSeries" :key="s.series_id">
                                <option :value="s.series_id" x-text="s.title" :selected="s.series_id == form.polymarket.series_id"></option>
                            </template>
                        </select>
                        <p class="text-[10px] text-gray-500 mt-2 italic" x-show="!availableSeries.length">No series found or loading...</p>
                    </div>
                </div>
            </div>

            <!-- SuperTrend Cluster -->
            <div class="bg-gray-800 p-5 sm:p-6 rounded-lg shadow-lg">
                <h2 class="text-lg sm:text-xl font-bold mb-4 border-b border-gray-700 pb-2">SuperTrend Cluster</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mb-6">
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Consensus Threshold</label>
                        <input type="number" step="0.01" x-model.number="form.supertrend.consensus_threshold" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Base ST Index (1-5)</label>
                        <input type="number" x-model.number="form.supertrend.base_st_index" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>

                <div class="space-y-4">
                    <template x-for="i in [1,2,3,4,5]" :key="i">
                        <div class="p-4 bg-gray-900/50 rounded-lg border border-gray-700">
                            <h3 class="text-sm font-bold text-blue-400 mb-3 uppercase" x-text="'SuperTrend ' + i"></h3>
                            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                <div>
                                    <label class="block text-[10px] text-gray-500 mb-1 uppercase">ATR Len</label>
                                    <input type="number" x-model.number="form.supertrend['st'+i+'_atr_len']" class="w-full bg-gray-700 border-none rounded p-2 text-xs text-white">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-gray-500 mb-1 uppercase">Factor</label>
                                    <input type="number" step="0.1" x-model.number="form.supertrend['st'+i+'_factor']" class="w-full bg-gray-700 border-none rounded p-2 text-xs text-white">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-gray-500 mb-1 uppercase">MA Type</label>
                                    <select x-model="form.supertrend['st'+i+'_ma_type']" class="w-full bg-gray-700 border-none rounded p-2 text-xs text-white">
                                        <option value="SMA">SMA</option>
                                        <option value="EMA">EMA</option>
                                        <option value="WMA">WMA</option>
                                        <option value="HMA">HMA</option>
                                        <option value="LSMA">LSMA</option>
                                        <option value="RMA">RMA</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] text-gray-500 mb-1 uppercase">MA Len</label>
                                    <input type="number" x-model.number="form.supertrend['st'+i+'_ma_len']" class="w-full bg-gray-700 border-none rounded p-2 text-xs text-white">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-gray-500 mb-1 uppercase">Weight</label>
                                    <input type="number" step="0.1" x-model.number="form.supertrend['st'+i+'_weight']" class="w-full bg-gray-700 border-none rounded p-2 text-xs text-white">
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Secrets -->
            <div class="bg-gray-800 p-5 sm:p-6 rounded-lg shadow-lg">
                <h2 class="text-lg sm:text-xl font-bold mb-4 border-b border-gray-700 pb-2">Credentials</h2>
                <div>
                    <label class="block text-gray-400 text-xs sm:text-sm mb-2 uppercase font-bold tracking-wider">Private Key</label>
                    <input type="password" x-model="form.private_key" class="w-full bg-gray-700 border-none rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 transition" placeholder="0x...">
                </div>
            </div>

            <div class="flex justify-center sm:justify-end">
                <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-black py-4 px-12 rounded-xl shadow-xl transition transform active:scale-95 duration-200">
                    SAVE CHANGES
                </button>
            </div>
        </form>

        <div x-show="message" x-transition x-text="message" class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md p-4 rounded-lg text-center font-bold shadow-2xl z-50"
             :class="messageType === 'success' ? 'bg-green-600 text-white' : 'bg-red-600 text-white'"></div>
    </div>

    <script>
        function settingsPage() {
            return {
                form: {
                    mode: 'paper',
                    paper_balance_usd: 1000,
                    private_key: '',
                    polymarket: { series_id: '' },
                    trading: { symbol: '', risk_type: 'percent', risk_value: 10 },
                    supertrend: {}
                },
                message: '',
                messageType: '',
                availableSeries: [],
                async init() {
                    try {
                        const [res, sRes] = await Promise.all([
                            fetch('/api/settings').then(r => r.json()),
                            fetch('/api/available-series').then(r => r.json())
                        ]);
                        this.form = res;
                        this.availableSeries = sRes;
                    } catch (e) {
                        console.error("Failed to load settings", e);
                    }
                },
                async saveSettings() {
                    try {
                        const res = await fetch('/api/settings', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.form)
                        });
                        if (res.ok) {
                            this.message = "Settings Saved Successfully!";
                            this.messageType = 'success';
                            setTimeout(() => this.message = '', 3000);
                        } else {
                            throw new Error("Failed to save");
                        }
                    } catch (e) {
                        this.message = "Error Saving Settings";
                        this.messageType = 'error';
                        setTimeout(() => this.message = '', 3000);
                    }
                }
            }
        }
    </script>
</body>
</html>
