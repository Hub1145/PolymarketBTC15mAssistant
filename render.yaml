services:
  - type: web
    name: polymarket-btc-15m-assistant
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: SYMBOL
        value: "BTCUSDT"
      - key: POLL_INTERVAL_MS
        value: "1000"
